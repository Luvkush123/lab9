<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Information - XML Data Viewer - Luvkush Sharma (24BTRSN022)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 15px;
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:active {
            transform: scale(0.98);
        }

        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #555;
        }

        input[type="file"] {
            font-size: 14px;
        }

        .status-msg {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .status-msg.error {
            color: #e74c3c;
            background: #fde8e8;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #e74c3c;
        }

        .status-msg.success {
            color: #27ae60;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 6px;
        }

        table th, table td {
            padding: 12px 16px;
            text-align: left;
        }

        table th {
            background-color: #2c3e50;
            color: #ffffff;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table tbody tr {
            border-bottom: 1px solid #e0e0e0;
            transition: background-color 0.15s ease;
        }

        table tbody tr:nth-of-type(even) {
            background-color: #f8fafc;
        }

        table tbody tr:hover {
            background-color: #eef3f8;
        }

        .empty-placeholder {
            text-align: center;
            color: #95a5a6;
            padding: 30px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Employee Information</h1>
        <p class="subtitle">Reading and rendering XML data dynamically using Vanilla JavaScript &bull; Luvkush Sharma (24BTRSN022)</p>

        <div class="action-bar">
            <button onclick="loadXMLDoc()">Load employees.xml</button>
            <div class="file-upload-wrapper">
                <span>Or select file:</span>
                <input type="file" id="xmlFileInput" accept=".xml" onchange="loadFromFile(event)">
            </div>
        </div>

        <div id="statusMessage" class="status-msg"></div>

        <table id="employeeTable">
            <thead>
                <tr>
                    <th>Emp ID</th>
                    <th>Name</th>
                    <th>Designation</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="employeeTableBody">
                <tr>
                    <td colspan="6" class="empty-placeholder">Click "Load employees.xml" or select an XML file to view details.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Method 1: Fetch and parse employees.xml directly
        function loadXMLDoc() {
            const statusMsg = document.getElementById("statusMessage");
            statusMsg.className = "status-msg";
            statusMsg.textContent = "Loading employee data...";

            fetch("employees.xml")
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(xmlString => {
                    // Parse XML string into an XML DOM document
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlString, "text/xml");
                    
                    // Check for XML parsing errors
                    const parserError = xmlDoc.querySelector("parsererror");
                    if (parserError) {
                        throw new Error("Error parsing XML content.");
                    }

                    displayEmployeeTable(xmlDoc);
                    statusMsg.className = "status-msg success";
                    statusMsg.textContent = "Data loaded successfully from employees.xml!";
                })
                .catch(error => {
                    console.error("Fetch error:", error);
                    statusMsg.className = "status-msg error";
                    statusMsg.innerHTML = `<strong>Error loading XML file:</strong> ${error.message}<br>
                        <em>Note: When running locally via <code>file://</code>, browsers block XML requests due to CORS security. Run a local web server (e.g. <code>python3 -m http.server</code>) or use the "Or select file" button above.</em>`;
                });
        }

        // Method 2: Fallback to load XML from user file picker (works without a local server)
        function loadFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            const statusMsg = document.getElementById("statusMessage");

            reader.onload = function(e) {
                const xmlString = e.target.result;
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlString, "text/xml");

                const parserError = xmlDoc.querySelector("parsererror");
                if (parserError) {
                    statusMsg.className = "status-msg error";
                    statusMsg.textContent = "Invalid XML file format.";
                    return;
                }

                displayEmployeeTable(xmlDoc);
                statusMsg.className = "status-msg success";
                statusMsg.textContent = `Loaded ${file.name} successfully!`;
            };

            reader.readAsText(file);
        }

        // Function to extract nodes and build the table
        function displayEmployeeTable(xmlDoc) {
            const employees = xmlDoc.getElementsByTagName("employee");
            const tbody = document.getElementById("employeeTableBody");
            tbody.innerHTML = "";

            if (employees.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-placeholder">No employee records found.</td></tr>';
                return;
            }

            for (let i = 0; i < employees.length; i++) {
                const emp = employees[i];

                const id = getElementValue(emp, "id");
                const name = getElementValue(emp, "name");
                const designation = getElementValue(emp, "designation");
                const department = getElementValue(emp, "department");
                const salary = getElementValue(emp, "salary");
                const email = getElementValue(emp, "email");

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${id}</td>
                    <td><strong>${name}</strong></td>
                    <td>${designation}</td>
                    <td>${department}</td>
                    <td>₹${Number(salary).toLocaleString('en-IN')}</td>
                    <td>${email}</td>
                `;
                tbody.appendChild(row);
            }
        }

        // Helper function to safely get text content from an XML element tag
        function getElementValue(parent, tagName) {
            const element = parent.getElementsByTagName(tagName)[0];
            return element ? element.textContent.trim() : "-";
        }
    </script>
</body>
</html>
